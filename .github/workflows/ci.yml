name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  JULIA_VERSION: '1.13'

jobs:
  core:
    name: Julia core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}
      - uses: julia-actions/cache@v2
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()'

  ui-backend:
    name: HimalayaUI ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group: [db, pipeline, routes, events, wire, migration]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}
      - uses: julia-actions/cache@v2
      - name: Install
        run: julia --project=packages/HimalayaUI -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Test
        env:
          GROUP: ${{ matrix.group }}
        run: julia --project=packages/HimalayaUI -e 'using Pkg; Pkg.test("HimalayaUI")'

  frontend:
    name: Frontend build and Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/HimalayaUI/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/HimalayaUI/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run --if-present test:verify
