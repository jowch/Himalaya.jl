name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  JULIA_VERSION: '1.13'
  JULIA_CPU_TARGET: 'generic;haswell,clone_all'

jobs:
  core:
    name: Julia core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}
      - uses: julia-actions/cache@v2
        with:
          cache-name: core-${{ env.JULIA_CPU_TARGET }}
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()'

  peak-model:
    name: HimalayaPeakModel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}
      - uses: julia-actions/cache@v2
        with:
          cache-name: peak-model-${{ env.JULIA_CPU_TARGET }}
      - run: julia --project=packages/HimalayaPeakModel -e 'using Pkg; Pkg.instantiate(); Pkg.test(; julia_args=["--threads=4"])'

  himalayadb:
    name: HimalayaDB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}
      - uses: julia-actions/cache@v2
        with:
          cache-name: himalayadb-${{ env.JULIA_CPU_TARGET }}
      - run: julia --project=packages/HimalayaDB -e 'using Pkg; Pkg.instantiate(); Pkg.test()'

  ui-groups:
    name: HimalayaUI test groups
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}
      - id: groups
        shell: bash
        run: |
          julia -e '
            ex = Meta.parseall(read("packages/HimalayaUI/test/runtests.jl", String))
            d = only(a.args[1] for a in ex.args if a isa Expr && a.head == :const && a.args[1].args[1] == :GROUPS)
            println("groups=[", join(repr.(first.(Core.eval(Main, d.args[2]))), ","), "]")
          ' | tee -a "$GITHUB_OUTPUT"

  ui-backend:
    name: HimalayaUI ${{ matrix.group }}
    needs: ui-groups
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.ui-groups.outputs.groups) }}
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}
      - uses: julia-actions/cache@v2
        with:
          cache-name: ui-backend-${{ env.JULIA_CPU_TARGET }}
          include-matrix: false
      - name: Install
        run: |
          printf '[HimalayaUI]\nprecompile_workload = false\n' > packages/HimalayaUI/LocalPreferences.toml
          julia --project=packages/HimalayaUI -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Test
        env:
          GROUP: ${{ matrix.group }}
        run: julia --project=packages/HimalayaUI -e 'using Pkg; Pkg.test("HimalayaUI"; julia_args=["--threads=4,1"])'

  peak-classifier:
    name: Peak classifier tool
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}
      - uses: julia-actions/cache@v2
        with:
          cache-name: peak-classifier-${{ env.JULIA_CPU_TARGET }}
      - run: |
          printf '[HimalayaUI]\nprecompile_workload = false\n' > tools/peak-classifier/LocalPreferences.toml
          julia --project=tools/peak-classifier -e 'using Pkg; Pkg.instantiate(); Pkg.test(; julia_args=["--threads=4"])'

  frontend:
    name: Frontend build and Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/HimalayaUI/frontend
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/HimalayaUI/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          CONTRACTS_BASE: HEAD^1
      - run: npm run typecheck:test
      - run: npm test
      - run: npm run test:verify

  e2e:
    name: Frontend E2E (mocked)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/HimalayaUI/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/HimalayaUI/frontend/package-lock.json
      - run: npm ci
      - name: Install Chromium
        timeout-minutes: 14
        uses: ./.github/actions/playwright-chromium
      - name: Playwright tests
        timeout-minutes: 10
        run: npx playwright test --trace retain-on-failure
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            packages/HimalayaUI/frontend/playwright-report/
            packages/HimalayaUI/frontend/test-results/
          if-no-files-found: ignore

  demo-truth:
    name: Demo check-truth (live app)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}
      - uses: julia-actions/cache@v2
        with:
          cache-name: demo-truth-${{ env.JULIA_CPU_TARGET }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/HimalayaUI/frontend/package-lock.json
      - name: Install frontend
        run: cd packages/HimalayaUI/frontend && npm ci
      - name: Install Chromium
        timeout-minutes: 14
        uses: ./.github/actions/playwright-chromium
      - name: Install Julia packages
        run: |
          julia --project=packages/HimalayaUI -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Check the demo against TRUTH.csv
        run: make verify-truth
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-truth
          path: |
            scratch/verify/truth/
            scratch/verify/demo.log
            scratch/demo/backend.log
          if-no-files-found: ignore

  upgrade-drill:
    name: Upgrade drill (base DB opened on head)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}
      - uses: julia-actions/cache@v2
        with:
          cache-name: upgrade-drill-${{ env.JULIA_CPU_TARGET }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/HimalayaUI/frontend/package-lock.json
      - name: Install frontend
        run: cd packages/HimalayaUI/frontend && npm ci
      - name: Install Chromium
        timeout-minutes: 14
        uses: ./.github/actions/playwright-chromium
      - name: Install Julia packages
        run: |
          julia --project=packages/HimalayaUI -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Review a demo DB on the base, then open it on this head
        env:
          UPGRADE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD^' }}
        run: make upgrade-drill
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-drill
          path: |
            scratch/upgrade/out/
            scratch/upgrade/db/backend.log
            scratch/verify/demo.log
          if-no-files-found: ignore

  cold-start:
    name: Cold start (first-use compile)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}
      - uses: julia-actions/cache@v2
        with:
          cache-name: cold-start-${{ env.JULIA_CPU_TARGET }}
      - name: Install
        run: julia --project=packages/HimalayaUI -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Cached code survives loading
        run: julia --threads=4,1 --project=packages/HimalayaUI scripts/check_precompile_cache.jl
      - name: Demo data
        run: make demo-data
      - name: Ingest the demo
        run: julia --threads=4,1 --project=packages/HimalayaUI scripts/check_first_use.jl prepare scratch/demo-experiment scratch/cold-start.db
      - name: First use stays within its compile budget
        run: julia --threads=4,1 --trace-compile=scratch/cold-start-trace.jl --trace-compile-timing --project=packages/HimalayaUI scripts/check_first_use.jl measure scratch/cold-start.db
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cold-start-trace
          path: scratch/cold-start-trace.jl
          if-no-files-found: ignore

  ci-ok:
    name: CI ok
    if: always()
    needs: [core, himalayadb, ui-groups, ui-backend, frontend, e2e, demo-truth, upgrade-drill, cold-start]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo ok
