<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Series folio — "The Print"</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet" />
<style>
  /*
   * The series folio — the home of the Series stage. A wall of saved
   * comparisons, each a small live plate. Corpus-wide: experiment is a
   * filter facet, not a container, so the folio spans every beamtime.
   *
   * A series is a recipe + a plate: the card shows the frozen plate (its
   * mini-waterfall), and the recipe surfaces as a "+N new" pill when the
   * machine finds samples that match but are not yet in the series.
   *
   * The folio escapes the "identical card grid" anti-pattern for free:
   * each card is a real miniature of that series' waterfall, and a
   * 6-sample series is a taller plate than a 3-sample one — so the wall
   * is a masonry of distinct figures, not a uniform matrix.
   */
  :root {
    --paper:        oklch(0.978 0.006 85);
    --paper-sunk:   oklch(0.951 0.008 84);
    --plate:        oklch(0.992 0.004 90);
    --ink:          oklch(0.265 0.013 68);
    --ink-soft:     oklch(0.467 0.012 70);
    --ink-faint:    oklch(0.640 0.010 74);
    --hair:         oklch(0.882 0.008 80);
    --hair-strong:  oklch(0.806 0.010 78);

    /* ── Shared phase palette ──────────────────────────────────────────
       Byte-identical across all three surface mockups (sample-table,
       focus-workspace, series-builder). Light-paper tuning: darker, a
       touch more chroma than DESIGN.md's dark values, so each reads at
       AA on --plate. The full eight-phase set extends from here. */
    --pn3m:  oklch(0.585 0.150 58);    /* amber */
    --lam:   oklch(0.505 0.150 264);   /* periwinkle-indigo */
    --im3m:  oklch(0.520 0.120 162);   /* sage */
    --hex:   oklch(0.540 0.130 350);   /* rose */

    --accent: oklch(0.555 0.150 38);
    --unindexed: oklch(0.660 0.012 76);

    --radius: 7px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
    font-size: 13px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .app { height: 100%; display: flex; flex-direction: column; }

  /* ── Top bar ───────────────────────────────────────────────────────── */
  .topbar {
    height: 56px; flex-shrink: 0;
    display: flex; align-items: center; gap: 16px;
    padding: 0 24px; border-bottom: 1px solid var(--hair);
  }
  /* corpus-level: no experiment in the crumb — experiment is now a facet */
  .wordmark {
    font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase;
    font-weight: 700; color: var(--ink);
  }
  .wordmark .tail { color: var(--ink-faint); font-weight: 600; }
  .topbar .spacer { flex: 1; }
  .stage-tabs { display: flex; gap: 2px; }
  .stage-tab {
    font-size: 11px; letter-spacing: 0.04em; font-weight: 600;
    text-transform: uppercase; color: var(--ink-faint);
    padding: 6px 11px; border-radius: 5px; cursor: pointer;
    border: none; background: none;
  }
  .stage-tab.is-active { color: var(--ink); background: var(--paper-sunk); }
  .stage-tab .dot {
    display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: var(--hair-strong); margin-right: 6px; vertical-align: 1px;
  }
  .stage-tab.is-active .dot { background: var(--accent); }
  .btn {
    font-family: inherit; font-size: 12px; font-weight: 600;
    border-radius: 6px; cursor: pointer; padding: 7px 13px;
    border: 1px solid var(--hair-strong); background: var(--plate);
    color: var(--ink);
  }
  .btn:hover { background: var(--paper-sunk); }
  .btn-solid { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .btn-solid:hover { background: oklch(0.36 0.013 68); }

  /* ── Stage ─────────────────────────────────────────────────────────── */
  .stage { flex: 1; overflow: auto; padding: 34px 40px 80px; }
  .folio-shell { max-width: 1380px; margin: 0 auto; }

  /* ── Header ────────────────────────────────────────────────────────── */
  .head {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 32px; margin-bottom: 20px;
  }
  .kicker {
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    font-weight: 700; color: var(--accent); margin-bottom: 7px;
  }
  .head h1 {
    font-family: "Newsreader", Georgia, serif;
    font-size: 31px; line-height: 1.12; font-weight: 500;
    letter-spacing: -0.005em; color: var(--ink);
  }
  .head .sub {
    margin-top: 8px; font-size: 13px; color: var(--ink-soft); max-width: 60ch;
  }
  .head-count { flex-shrink: 0; text-align: right; }
  .head-count .hc-n {
    font-family: "Newsreader", Georgia, serif;
    font-size: 26px; font-weight: 500; color: var(--ink); line-height: 1;
  }
  .head-count .hc-l {
    margin-top: 3px; font-size: 10.5px; letter-spacing: 0.08em;
    text-transform: uppercase; font-weight: 700; color: var(--ink-faint);
  }

  /* ── Controls: search · sort · filter ──────────────────────────────── */
  .controls {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding-bottom: 16px; margin-bottom: 22px;
    border-bottom: 1px solid var(--hair);
  }
  .search {
    display: flex; align-items: center; gap: 7px;
    background: var(--plate); border: 1px solid var(--hair-strong);
    border-radius: 7px; padding: 6px 11px; min-width: 230px;
  }
  .search svg { flex-shrink: 0; }
  .search input {
    font-family: inherit; font-size: 12.5px; color: var(--ink);
    border: none; background: none; outline: none; width: 100%;
  }
  .search input::placeholder { color: var(--ink-faint); }
  .chips { display: flex; gap: 6px; }
  .chip {
    font-family: inherit; font-size: 11.5px; font-weight: 600;
    border: 1px solid var(--hair-strong); background: var(--plate);
    border-radius: 999px; padding: 5px 12px; cursor: pointer; color: var(--ink-soft);
  }
  .chip:hover { border-color: var(--ink-faint); }
  .chip.on {
    background: var(--ink); color: var(--paper); border-color: var(--ink);
  }
  .ctrl-spacer { flex: 1; }
  .sort-label {
    font-size: 10.5px; letter-spacing: 0.07em; text-transform: uppercase;
    font-weight: 700; color: var(--ink-faint);
  }
  .seg {
    display: flex; background: var(--plate);
    border: 1px solid var(--hair-strong); border-radius: 6px; overflow: hidden;
  }
  .seg button {
    font-family: inherit; font-size: 11.5px; font-weight: 600;
    padding: 6px 11px; border: none; background: none; cursor: pointer;
    color: var(--ink-faint);
  }
  .seg button.on { background: var(--ink); color: var(--paper); }

  /* ── The wall: a masonry of plate-cards ────────────────────────────── */
  .gallery { column-count: 3; column-gap: 22px; }
  @media (max-width: 1180px) { .gallery { column-count: 2; } }
  @media (max-width: 720px)  { .gallery { column-count: 1; } }

  .card {
    break-inside: avoid; width: 100%; margin-bottom: 22px;
    background: var(--plate); border: 1px solid var(--hair);
    border-radius: 5px; overflow: hidden; cursor: pointer;
    box-shadow: 0 1px 1px rgba(60,52,40,.04), 0 10px 26px -22px rgba(60,52,40,.30);
    transition: transform 160ms cubic-bezier(.22,1,.36,1),
                box-shadow 160ms cubic-bezier(.22,1,.36,1),
                border-color 160ms ease-out;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: var(--hair-strong);
    box-shadow: 0 2px 3px rgba(60,52,40,.05), 0 22px 40px -20px rgba(60,52,40,.34);
  }
  .card.is-draft { border-style: dashed; border-color: var(--hair-strong);
    box-shadow: none; }
  .card.is-draft:hover { box-shadow: 0 16px 32px -24px rgba(60,52,40,.3); }

  /* the mini figure — the frozen plate, sitting on the card surface */
  .card-fig {
    padding: 8px 8px 0; background:
      linear-gradient(var(--paper-sunk), var(--paper-sunk)) bottom/100% 1px no-repeat;
  }
  .card-fig svg { display: block; width: 100%; height: auto; }
  .card.is-draft .card-fig { opacity: 0.62; }
  svg .wf-base { stroke: var(--hair); stroke-width: 1; stroke-dasharray: 2 3; }
  svg .wf-fill { opacity: 0.09; }
  svg .wf-line { fill: none; stroke-width: 1.6; stroke-linejoin: round; }
  svg .wf-tick { stroke-width: 1.4; stroke-linecap: round; }

  /* the card body */
  .card-body { padding: 13px 16px 14px; }
  .card-kick {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 5px;
  }
  .fig-n {
    font-size: 10.5px; letter-spacing: 0.11em; text-transform: uppercase;
    font-weight: 700; color: var(--accent);
  }
  .pill {
    font-size: 10px; font-weight: 700; letter-spacing: 0.03em;
    padding: 2px 8px; border-radius: 999px;
  }
  .pill-new {
    color: var(--accent);
    background: color-mix(in oklab, var(--accent) 14%, transparent);
  }
  .pill-draft {
    color: var(--ink-faint); background: var(--paper-sunk);
    border: 1px dashed var(--hair-strong);
  }
  .card-title {
    font-family: "Newsreader", Georgia, serif;
    font-size: 19px; line-height: 1.2; font-weight: 500;
    letter-spacing: -0.003em; color: var(--ink);
  }
  .card-meta {
    margin-top: 5px; font-size: 11.5px; color: var(--ink-faint);
    display: flex; align-items: center; gap: 7px;
  }
  .card-meta .dot { color: var(--hair-strong); }
  .card-meta b { color: var(--ink-soft); font-weight: 600; }

  /* the phase strip — one cell per sample, coloured by phase call.
     Scannable across the whole wall: a transition reads at a glance. */
  .ps {
    margin-top: 11px; display: flex; gap: 2px; height: 7px;
  }
  .ps-seg { flex: 1; border-radius: 1.5px; }
  .ps-cap {
    margin-top: 6px; font-size: 11px; color: var(--ink-soft);
    display: flex; align-items: center; gap: 5px;
  }
  .ps-cap .arr { color: var(--ink-faint); }
  .ps-cap .ph { font-weight: 600; }

  .card-foot {
    margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--hair);
    display: flex; align-items: center; justify-content: space-between;
    font-size: 10.5px; color: var(--ink-faint);
  }
  .cf-prov { display: flex; align-items: center; gap: 5px; }
  .cf-prov.cross { color: var(--ink-soft); }
  .cf-prov .xref { color: var(--accent); font-weight: 700; }
  .cf-edit b { color: var(--ink-soft); font-weight: 600; }

  /* the empty state — shown when a filter or search matches nothing */
  .empty {
    display: none; text-align: center; padding: 70px 20px;
    color: var(--ink-faint);
  }
  .empty.show { display: block; }
  .empty h2 {
    font-family: "Newsreader", Georgia, serif; font-weight: 500;
    font-size: 21px; color: var(--ink-soft); margin-bottom: 6px;
  }
</style>
</head>
<body>
<div class="app">

  <!-- ── Top bar — corpus-level, no experiment crumb ─────────────────── -->
  <div class="topbar">
    <span class="wordmark">Himalaya <span class="tail">· SAXS</span></span>
    <div class="stage-tabs">
      <button class="stage-tab"><span class="dot"></span>Samples</button>
      <button class="stage-tab"><span class="dot"></span>Index</button>
      <button class="stage-tab is-active"><span class="dot"></span>Series</button>
    </div>
    <span class="spacer"></span>
    <button class="btn btn-solid" id="new-series">+ New series</button>
  </div>

  <div class="stage">
    <div class="folio-shell">

      <div class="head">
        <div>
          <div class="kicker">Folio</div>
          <h1>Saved series</h1>
          <p class="sub">
            Every comparison you've built, across all beamtimes. Pick one up
            where you left off &mdash; or select samples on the contact sheet
            to start a new one.
          </p>
        </div>
        <div class="head-count">
          <div class="hc-n" id="hc-n">5</div>
          <div class="hc-l" id="hc-l">series in the folio</div>
        </div>
      </div>

      <!-- exploration controls -->
      <div class="controls">
        <div class="search">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <circle cx="6" cy="6" r="4.3" stroke="var(--ink-faint)" stroke-width="1.5"/>
            <line x1="9.2" y1="9.2" x2="12.5" y2="12.5"
                  stroke="var(--ink-faint)" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input type="text" id="search" placeholder="Search series&hellip;" />
        </div>
        <div class="chips" id="chips">
          <button class="chip on" data-filter="all">All</button>
          <button class="chip" data-filter="transition">Has transition</button>
          <button class="chip" data-filter="cross">Cross-experiment</button>
        </div>
        <span class="ctrl-spacer"></span>
        <span class="sort-label">Sort</span>
        <div class="seg" id="sort-seg">
          <button data-sort="recent" class="on">Recent</button>
          <button data-sort="variable">Variable</button>
          <button data-sort="size">Largest</button>
        </div>
      </div>

      <div class="gallery" id="gallery"></div>
      <div class="empty" id="empty">
        <h2>No series match</h2>
        <div>Clear the search or filter to see the whole folio.</div>
      </div>

    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════════
 * The folio's contents: saved series across the whole corpus. Each is
 * built on the LL37-titration sample set the other surfaces share.
 * A trace = one sample's integration; comps = the phase(s) present.
 * ════════════════════════════════════════════════════════════════════ */

const PHASES = {
  Pn3m:     { ratios: [1, 1.2247, 1.4142, 1.7321], color: 'var(--pn3m)' },
  Lamellar: { ratios: [1, 2, 3, 4],                color: 'var(--lam)' },
  Im3m:     { ratios: [1, 1.4142, 1.7321, 2.0],    color: 'var(--im3m)' },
};
const PHASE_COLOR = { Pn3m:'var(--pn3m)', Lamellar:'var(--lam)',
                      Im3m:'var(--im3m)', Hexagonal:'var(--hex)' };

/* p = Pn3m component, l = Lamellar component — amplitudes tell the story */
const P = (q0, amp) => ({ phase:'Pn3m', q0, amp });
const L = (q0, amp) => ({ phase:'Lamellar', q0, amp });

const LIBRARY = [
  { id:'s1', fig:1, title:'LL37 titration of lipid 1-2',
    variable:'LL37 : lipid ratio', editedDays:2, author:'JC',
    beamtime:'SSRL · Apr 2026', newMatches:1,
    traces:[
      { comps:[P(0.0444,1.00)] },
      { comps:[P(0.0447,0.86)] },
      { comps:[P(0.0451,0.52), L(0.1030,0.34)] },
      { comps:[P(0.0455,0.21), L(0.1042,0.72)] },
      { comps:[L(0.1050,0.94)] },
      { comps:[L(0.1056,1.00)] },
    ] },

  { id:'s2', fig:2, title:'LL37 titration of lipid 1-1',
    variable:'LL37 : lipid ratio', editedDays:5, author:'JC',
    beamtime:'SSRL · Apr 2026', newMatches:0,
    traces:[
      { comps:[P(0.0461,1.00)] },
      { comps:[P(0.0466,0.58), L(0.1071,0.20)] },
      { comps:[P(0.0470,0.27), L(0.1080,0.66)] },
      { comps:[L(0.1088,0.96)] },
    ] },

  { id:'s3', fig:3, title:'Lipid 1-2 cubic phase — April vs July',
    variable:'beamtime', editedDays:7, author:'AM',
    beamtime:'2 beamtimes', crossExperiment:true, newMatches:0,
    traces:[
      { comps:[P(0.0443,0.94)] },
      { comps:[P(0.0446,1.00)] },
      { comps:[P(0.0449,0.88)] },
      { comps:[P(0.0444,0.96)] },
      { comps:[P(0.0447,0.91)] },
    ] },

  { id:'s4', fig:4, title:'Buffer & lipid baselines',
    variable:'sample', editedDays:14, author:'JC',
    beamtime:'SSRL · Apr 2026', newMatches:0,
    traces:[ { comps:[] }, { comps:[] }, { comps:[] } ] },

  { id:'s5', fig:null, title:'Lipid 1-2 dose response',
    variable:'LL37 : lipid ratio', editedDays:0, author:'JC',
    beamtime:'SSRL · Apr 2026', draft:true, newMatches:0,
    traces:[
      { comps:[P(0.0445,0.92)] },
      { comps:[P(0.0452,0.46), L(0.1035,0.40)] },
      { comps:[L(0.1048,0.90)] },
    ] },
];

/* dominant phase per trace; the series' phase story across the order */
LIBRARY.forEach(s => {
  s.traces.forEach(t => {
    if (t.comps.length === 0) { t.dom = null; return; }
    t.dom = t.comps.slice().sort((a,b) => b.amp - a.amp)[0].phase;
    t.coexist = t.comps.length > 1;
  });
  const doms = s.traces.map(t => t.dom);
  s.hasTransition = new Set(doms).size > 1;
});

/* ── intensity model: decaying background + sharp Bragg peaks ─────────── */
function intensity(q, comps) {
  let v = 0.26 * Math.pow(0.02 / q, 0.9);
  for (const c of comps) {
    PHASES[c.phase].ratios.forEach((r, i) => {
      const qp = c.q0 * r;
      const h  = c.amp * Math.pow(0.6, i);
      const sg = 0.03 * qp + 0.0006;
      v += h * Math.exp(-0.5 * Math.pow((q - qp) / sg, 2));
    });
  }
  return v;
}

/* ── the mini-waterfall: a small frozen plate ─────────────────────────── */
const Q = { min: 0.02, max: 0.42 };

function figSVG(s) {
  const n = s.traces.length;
  const W = 340, stepY = 31, amp = 24, padT = 12, padB = 12, padL = 14, padR = 14;
  const H = padT + padB + n * stepY;
  const PW = W - padL - padR;
  const xOf = q => padL + (Math.log(q) - Math.log(Q.min)) /
                          (Math.log(Q.max) - Math.log(Q.min)) * PW;

  const NSAMP = 150, qs = [];
  for (let i = 0; i <= NSAMP; i++) {
    const f = i / NSAMP;
    qs.push(Math.exp(Math.log(Q.min) + f * (Math.log(Q.max) - Math.log(Q.min))));
  }
  let gmax = 1e-6;
  const curves = s.traces.map(t => {
    const ys = qs.map(q => intensity(q, t.comps));
    gmax = Math.max(gmax, ...ys);
    return ys;
  });
  const hS = amp / gmax;
  const baseY = i => H - padB - i * stepY;

  let out = '';
  s.traces.forEach((t, i) => {
    const y0  = baseY(i);
    const col = t.dom ? PHASE_COLOR[t.dom] : 'var(--unindexed)';
    out += `<line class="wf-base" x1="${padL}" y1="${y0}" x2="${W-padR}" y2="${y0}"/>`;

    let d = '';
    qs.forEach((q, k) => {
      const x = xOf(q), y = y0 - curves[i][k] * hS;
      d += (k === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
    });
    out += `<path class="wf-fill" d="${d}L${W-padR} ${y0} L${padL} ${y0} Z" fill="${col}"/>`;
    out += `<path class="wf-line" d="${d}" stroke="${col}"/>`;

    /* a few short peak ticks hugging the baseline */
    t.comps.forEach(c => {
      PHASES[c.phase].ratios.forEach((r, k) => {
        if (k >= 3) return;
        const qp = c.q0 * r;
        if (qp < Q.min || qp > Q.max) return;
        const x = xOf(qp), th = 4 + 3 * Math.pow(0.6, k);
        out += `<line class="wf-tick" x1="${x.toFixed(1)}" y1="${y0+1.5}" ` +
               `x2="${x.toFixed(1)}" y2="${y0+1.5+th}" stroke="${PHASE_COLOR[c.phase]}" ` +
               `opacity="${(0.5 + 0.35*Math.pow(0.7,k)).toFixed(2)}"/>`;
      });
    });
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img"
    aria-label="${n}-trace waterfall preview">${out}</svg>`;
}

/* ── the phase strip + its caption ────────────────────────────────────── */
function phaseStrip(s) {
  const segs = s.traces.map(t => {
    if (!t.dom) return `<div class="ps-seg" style="background:var(--unindexed)"></div>`;
    if (t.coexist) {
      const a = PHASE_COLOR[t.comps[0].phase], b = PHASE_COLOR[t.comps[1].phase];
      return `<div class="ps-seg" style="background:linear-gradient(` +
             `100deg, ${a} 42%, ${b} 58%)"></div>`;
    }
    return `<div class="ps-seg" style="background:${PHASE_COLOR[t.dom]}"></div>`;
  }).join('');

  const first = s.traces[0].dom, last = s.traces[s.traces.length-1].dom;
  let cap;
  if (!first && !last) {
    cap = `<span class="ph" style="color:var(--ink-faint)">No clear phase</span>`;
  } else if (s.hasTransition) {
    cap = `<span class="ph" style="color:${PHASE_COLOR[first]}">${first}</span>` +
          `<span class="arr">&rarr;</span>` +
          `<span class="ph" style="color:${PHASE_COLOR[last]}">${last}</span>`;
  } else {
    cap = `<span class="ph" style="color:${PHASE_COLOR[first]}">${first}</span>` +
          `<span class="arr">throughout</span>`;
  }
  return `<div class="ps">${segs}</div><div class="ps-cap">${cap}</div>`;
}

/* ── a card ───────────────────────────────────────────────────────────── */
function cardHTML(s) {
  const pill = s.draft
    ? `<span class="pill pill-draft">Draft</span>`
    : (s.newMatches > 0
        ? `<span class="pill pill-new">+${s.newMatches} new match</span>` : '');

  const prov = s.crossExperiment
    ? `<span class="cf-prov cross"><span class="xref">&#8644;</span>
         April + July &middot; q normalized</span>`
    : `<span class="cf-prov">${s.beamtime}</span>`;

  const edited = s.editedDays === 0 ? 'just now'
    : s.editedDays === 1 ? 'yesterday'
    : s.editedDays < 7 ? s.editedDays + ' days ago'
    : s.editedDays < 14 ? '1 week ago' : '2 weeks ago';

  return `<article class="card ${s.draft ? 'is-draft' : ''}" data-id="${s.id}">
    <div class="card-fig">${figSVG(s)}</div>
    <div class="card-body">
      <div class="card-kick">
        <span class="fig-n">${s.draft ? 'Recipe' : 'Fig. ' + s.fig}</span>
        ${pill}
      </div>
      <h3 class="card-title">${s.title}</h3>
      <div class="card-meta">
        <b>${s.traces.length} samples</b><span class="dot">&middot;</span>
        <span>by ${s.variable}</span>
      </div>
      ${phaseStrip(s)}
      <div class="card-foot">
        ${prov}
        <span class="cf-edit">edited <b>${edited}</b> &middot; ${s.author}</span>
      </div>
    </div>
  </article>`;
}

/* ── render with the current search · filter · sort ───────────────────── */
let state = { search: '', filter: 'all', sort: 'recent' };

function render() {
  let rows = LIBRARY.slice();

  const q = state.search.trim().toLowerCase();
  if (q) rows = rows.filter(s => s.title.toLowerCase().includes(q));
  if (state.filter === 'transition') rows = rows.filter(s => s.hasTransition);
  if (state.filter === 'cross')      rows = rows.filter(s => s.crossExperiment);

  if (state.sort === 'recent')   rows.sort((a,b) => a.editedDays - b.editedDays);
  if (state.sort === 'size')     rows.sort((a,b) => b.traces.length - a.traces.length);
  if (state.sort === 'variable') rows.sort((a,b) =>
    a.variable.localeCompare(b.variable) || a.editedDays - b.editedDays);

  document.getElementById('gallery').innerHTML = rows.map(cardHTML).join('');
  document.getElementById('empty').classList.toggle('show', rows.length === 0);

  const filtered = state.search.trim() !== '' || state.filter !== 'all';
  document.getElementById('hc-n').textContent = rows.length;
  document.getElementById('hc-l').textContent =
    filtered ? `of ${LIBRARY.length} shown` : 'series in the folio';
}

/* ── controls ─────────────────────────────────────────────────────────── */
document.getElementById('search').addEventListener('input', e => {
  state.search = e.target.value; render();
});
document.getElementById('chips').addEventListener('click', e => {
  const c = e.target.closest('.chip');
  if (!c) return;
  document.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
  c.classList.add('on');
  state.filter = c.dataset.filter; render();
});
document.getElementById('sort-seg').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  document.querySelectorAll('#sort-seg button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  state.sort = b.dataset.sort; render();
});

render();
</script>
